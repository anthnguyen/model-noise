[project]
name = "attractors"
version = "0.1.0"
description = "Multi-agent attractor exploration suite: convergence dynamics in LLM-LLM conversations with residual-stream capture, perturbation, and verbalization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "zarr>=2.16,<3",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# GPU inference stack — install on the cluster, not needed for mock dry runs
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sentencepiece",
]
# Optional extras
viz = ["umap-learn>=0.5"]
logging = ["wandb"]

[tool.setuptools]
packages = ["src"]
